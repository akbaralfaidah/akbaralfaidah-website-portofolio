name: Supabase Keep Alive

# Mencegah instance Supabase free tier tidur (paused) karena tidak ada aktivitas.
# Supabase akan mem-pause project yang tidak ada request selama 7 hari.
# Workflow ini mengirim ping ringan setiap 5 hari agar tetap aktif.

on:
  schedule:
    - cron: '0 3 */5 * *'  # Setiap 5 hari sekali, jam 03:00 UTC (10:00 WIB)
  workflow_dispatch:        # Bisa juga dijalankan manual dari tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://qrtliglddxshyeabcjuj.supabase.co/rest/v1/public_projects_view?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase responded with HTTP $response"
          if [ "$response" -ne 200 ]; then
            echo "::warning::Supabase ping returned non-200 status: $response"
          fi
